# Hits the public signup RPC once a day so the free Supabase project
# does not pause for inactivity. Same endpoint the home page already
# calls before login — a real database round trip, not a dashboard visit.
#
# Setup (once):
#   Repo → Settings → Secrets and variables → Actions
#     SUPABASE_URL       = https://bdraobzoppsguqvtlsdq.supabase.co
#     SUPABASE_ANON_KEY  = the publishable key in shared/supabase-client.js
#   Then Actions → Keep Supabase awake → Run workflow
#
# Never put the service_role key here.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://bdraobzoppsguqvtlsdq.supabase.co}"
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Add repository secret SUPABASE_ANON_KEY (the publishable anon key, not service_role)."
            exit 1
          fi
          code=$(curl -sS -o /tmp/keepalive-body -w "%{http_code}" \
            -X POST "${URL}/rest/v1/rpc/codename_available" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"check_codename":"_keepalive"}')
          echo "HTTP ${code}"
          cat /tmp/keepalive-body
          echo
          test "${code}" = "200"
